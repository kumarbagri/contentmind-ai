name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'posts.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static pages
        run: node scripts/build.js
      - name: Commit changes
        run: |
          git config user.name "contentmind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-build: regenerate blog pages and listings"
            git push
          else
            echo "No changes to commit"
          fi
